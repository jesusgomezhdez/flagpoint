<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Flagpoint · Imagen promocional 440×280</title>
    <style>
      @font-face {
        font-family: 'Excalifont';
        src: url('../src/assets/fonts/excalifont-regular.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #0f172a;
        /* Mismo fondo que el editor: manchas pastel + cuadrícula de puntos. */
        background:
          radial-gradient(circle, rgb(15 23 42 / 0.16) 1px, transparent 1.4px) 9px 9px / 18px 18px,
          radial-gradient(48% 60% at 6% 10%, rgb(251 207 232 / 0.85), transparent 70%),
          radial-gradient(46% 58% at 96% 6%, rgb(191 219 254 / 0.9), transparent 70%),
          radial-gradient(50% 60% at 98% 96%, rgb(167 243 208 / 0.75), transparent 70%),
          radial-gradient(46% 56% at 4% 98%, rgb(254 215 170 / 0.7), transparent 70%),
          radial-gradient(40% 46% at 52% 52%, rgb(221 214 254 / 0.6), transparent 75%),
          #f6f6f9;
      }

      .card {
        position: absolute;
        left: 24px;
        top: 26px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 14px 26px 14px 8px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgb(255 255 255 / 0.78), rgb(255 255 255 / 0.52));
        border: 1px solid rgb(255 255 255 / 0.85);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.9),
          0 18px 40px -16px rgb(15 23 42 / 0.25),
          0 2px 8px -2px rgb(15 23 42 / 0.08);
      }

      .card img {
        width: 128px;
        height: 128px;
        display: block;
      }

      .name {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .tagline {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 500;
        color: #475569;
      }

      .chips {
        display: flex;
        gap: 5px;
        margin-top: 12px;
      }

      .chips span {
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 600;
        color: #4f46e5;
        background: rgb(224 231 255 / 0.9);
        box-shadow: inset 0 0 0 1px rgb(99 102 241 / 0.2);
      }

      /* Post-it como los del editor: pastel sólido, esquinas redondeadas, Excalifont. */
      .note {
        position: absolute;
        right: 22px;
        bottom: 16px;
        width: 116px;
        padding: 10px 12px 12px;
        border-radius: 12px;
        background: #fde68a;
        box-shadow:
          inset 0 0 0 1.5px rgb(255 255 255 / 0.6),
          0 14px 28px -10px rgb(15 23 42 / 0.3);
        transform: rotate(-5deg);
        font-family: 'Excalifont', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.2;
        color: #1e293b;
      }

      /* Flecha de anotación apuntando al post-it. */
      .arrow {
        position: absolute;
        right: 146px;
        bottom: 30px;
        width: 64px;
        height: 40px;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="../public/icon/128.png" alt="" />
      <div>
        <h1 class="name">Flagpoint</h1>
        <p class="tagline">Captura, anota y reporta<br />en segundos.</p>
        <div class="chips">
          <span>Flechas</span>
          <span>Texto</span>
          <span>Post-its</span>
        </div>
      </div>
    </div>

    <svg class="arrow" viewBox="0 0 64 40" aria-hidden="true">
      <path d="M4 10 C 20 30, 38 34, 52 26" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />
      <path d="M60 21 L 49 20 L 54 30 Z" fill="#ef4444" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" />
    </svg>

    <div class="note">¡Este botón<br />está mal!</div>
  </body>
</html>
